<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAX CBT 库容潮汐板</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #2c3e50; font-size: 14px;
    padding: 14px 20px 32px;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; font-weight: 600; margin: 16px 0 8px; color: #607d8b; letter-spacing: 0.5px; text-transform: uppercase; }

  .hdr { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid #e4e8ec; }
  .hdr .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hdr label { font-size: 12px; color: #666; display: inline-flex; align-items: center; gap: 4px; }
  .hdr input[type=date], .hdr input[type=time], .hdr input[type=number] {
    border: 1px solid #cfd8dc; border-radius: 4px; padding: 4px 6px; font-size: 13px; background: white;
  }
  .hdr input[type=number] { width: 70px; }
  .hdr button {
    background: white; border: 1px solid #cfd8dc; border-radius: 4px; padding: 4px 10px;
    cursor: pointer; font-size: 12px; color: #555;
  }
  .hdr button:hover { background: #eceff1; }

  /* 布局：左右两栏 */
  .main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

  /* 卡片 */
  .card { background: white; border-radius: 6px; padding: 14px 16px; border: 1px solid #e4e8ec; }
  .card + .card { margin-top: 12px; }

  /* 顶部摘要 */
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mcard { background: white; border-radius: 6px; padding: 10px 14px; border: 1px solid #e4e8ec; }
  .mcard .lbl { font-size: 11px; color: #78909c; letter-spacing: 0.5px; }
  .mcard .val { font-size: 22px; font-weight: 600; margin-top: 3px; color: #263238; line-height: 1.1; }
  .mcard .sub { font-size: 11px; color: #90a4ae; margin-top: 2px; }
  .mcard.warn { background: #fff3e0; border-color: #ffb74d; }
  .mcard.warn .val { color: #e65100; }
  .mcard.ok { background: #e8f5e9; border-color: #a5d6a7; }
  .mcard.ok .val { color: #1b5e20; }

  /* Dock 行 */
  .dock-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 1200px) { .dock-list { grid-template-columns: 1fr; } }
  .drow {
    display: grid; grid-template-columns: 48px 110px 1fr 70px; gap: 8px;
    align-items: center; padding: 8px 10px; border-radius: 5px;
    border: 1px solid #e4e8ec; background: #fafbfc;
  }
  .drow.idle { background: #f1f8e9; border-color: #c5e1a5; }
  .drow.loading { background: #fff8e1; border-color: #ffd54f; }
  .drow.unloading { background: #fff3e0; border-color: #ffab91; }
  .drow .dlab { font-weight: 600; color: #37474f; font-size: 15px; }
  .drow select {
    border: 1px solid #cfd8dc; border-radius: 4px; padding: 4px 6px; font-size: 12px;
    background: white; width: 100%; cursor: pointer;
  }
  .drow .meta-inputs { display: flex; gap: 6px; align-items: center; }
  .drow .meta-inputs input[type=text] {
    flex: 1 1 auto; min-width: 60px; border: 1px solid #cfd8dc; border-radius: 4px;
    padding: 4px 6px; font-size: 12px; background: white;
  }
  .drow .meta-inputs input[type=number] {
    width: 60px; border: 1px solid #cfd8dc; border-radius: 4px;
    padding: 4px 6px; font-size: 12px; background: white; text-align: right;
  }
  .drow .meta-inputs.hidden { visibility: hidden; }
  .drow .timecol { font-size: 11px; color: #78909c; text-align: right; }

  /* 关包 */
  .qty-input { display: grid; grid-template-columns: 1fr; gap: 6px; }
  textarea {
    width: 100%; min-height: 220px; resize: vertical;
    border: 1px solid #cfd8dc; border-radius: 4px; padding: 8px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.45; background: white; color: #263238;
  }
  textarea:focus { outline: 2px solid #42a5f5; outline-offset: -1px; }

  .qty-result { font-size: 12.5px; margin-top: 8px; }
  .qty-result table { width: 100%; border-collapse: collapse; }
  .qty-result th, .qty-result td { padding: 4px 8px; border-bottom: 1px solid #eceff1; text-align: left; }
  .qty-result th { background: #f5f7fa; font-weight: 500; color: #607d8b; font-size: 11px; letter-spacing: 0.3px; }
  .qty-result td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
  .qty-result tr.dest { background: #f8fafb; }
  .qty-result tr.dest td { font-weight: 600; color: #37474f; }
  .qty-result tr.total td { background: #eceff1; font-weight: 700; color: #1a237e; border-top: 2px solid #c5cae9; }

  .hint { font-size: 11px; color: #90a4ae; margin: 4px 0 0; }

  /* Admin / TT 模式切换 */
  .admin-only, .tt-only { display: none; }
  body.admin-mode .admin-only { display: inline-flex; }
  body.tt-mode .tt-only { display: inline-flex; }
  body.tt-mode #qtyText { background: #f5f7fa; color: #546e7a; cursor: not-allowed; }
  body.tt-mode #qtyText:focus { outline: none; }
  body.tt-mode .ray-only { display: none !important; }

  /* 顶部状态条 */
  #banner {
    padding: 6px 12px; border-radius: 4px; font-size: 12px;
    margin: 10px 0 0; display: flex; justify-content: space-between; align-items: center;
  }
  body.admin-mode #banner { background: #fff8e1; border: 1px solid #ffd54f; color: #795548; }
  body.tt-mode #banner { background: #e3f2fd; border: 1px solid #90caf9; color: #0d47a1; }

  button.primary { background: #1976d2; color: white; border-color: #1976d2; }
  button.primary:hover { background: #1565c0; }
  button.danger { background: #d32f2f; color: white; border-color: #d32f2f; }
  button.danger:hover { background: #b71c1c; }

  @media print {
    body { background: white; padding: 10px; }
    .hdr button { display: none; }
  }
</style>
</head>
<body>

<header class="hdr">
  <div>
    <h1>LAX CBT 库容潮汐板</h1>
    <div style="font-size:12px;color:#78909c;margin-top:3px" id="shiftLabel">—</div>
  </div>
  <div class="meta">
    <label>日期 <input type="date" id="shiftDate"></label>
    <label>时刻 <input type="time" id="snapTime"></label>
    <label>K <input type="number" id="K" min="0" step="10"></label>
    <button id="btnNow" class="ray-only">现在</button>
    <button id="btnRefresh" title="从 GitHub 拉最新 data.json">🔄 刷新</button>
    <button id="btnPublish" class="admin-only primary" title="把当前关包数据发布到 GitHub repo">🚀 发布</button>
    <button id="btnConfigPAT" class="admin-only" title="配置 GitHub Personal Access Token">🔑 Token</button>
    <button id="btnClear" class="ray-only">清空</button>
  </div>
</header>

<div id="banner">
  <span id="bannerText">—</span>
  <span id="updatedAt" style="font-size:11px;opacity:0.7;"></span>
</div>

<section class="summary" style="margin-top:14px">
  <div class="mcard" id="cPeak"><div class="lbl">场上关包</div><div class="val">—</div><div class="sub"></div></div>
  <div class="mcard" id="cUtil"><div class="lbl">场地利用率 Y/K</div><div class="val">—</div><div class="sub"></div></div>
  <div class="mcard" id="cDock"><div class="lbl">Dock 占用</div><div class="val">—</div><div class="sub"></div></div>
  <div class="mcard" id="cStatus"><div class="lbl">现场状态</div><div class="val">—</div><div class="sub"></div></div>
</section>

<div class="main">
  <!-- 左：Dock 状态 -->
  <div>
    <h2>Dock 状态（D16–D22）</h2>
    <div class="card">
      <div class="dock-list" id="dockList"></div>
    </div>
    <p class="hint">
      选 Loading 时填 carrier + 板数（gaylord）。
      <a href="#" id="loadDemo" class="ray-only" style="color:#78909c">填样例</a>
    </p>
  </div>

  <!-- 右：场上关包 -->
  <div>
    <h2>场上关包清单（粘贴）</h2>
    <div class="card">
      <div class="qty-input">
        <textarea id="qtyText" placeholder="按目的地分组粘贴，例如：
LAX
ONTRAC: 16
USPS: 25
FEDEX: 13
...

EWR
SWIFTX: 1

ATL 28+8滞留
SWIFTX: 6
..."></textarea>
      </div>
      <div class="qty-result" id="qtyResult"></div>
    </div>
  </div>
</div>

<script>
"use strict";
// =========================================================================
// 配置：GitHub repo（Pages 部署后填写）
// =========================================================================
const REPO_OWNER = "__OWNER__";       // 例：ray-xu
const REPO_NAME  = "__REPO__";        // 例：cbt-tide-board
const DATA_PATH  = "data.json";
const DATA_URL   = DATA_PATH;         // 相对路径，Pages 下 fetch 本仓库文件
// =========================================================================

// --- 模式识别 ---
// ?admin=1 → Ray 后台（可编辑 + 发布）；默认 → TT 视图（readonly 关包，fetch data.json）
const URL_PARAMS = new URLSearchParams(location.search);
const ADMIN_MODE = URL_PARAMS.get("admin") === "1";
const TT_MODE = !ADMIN_MODE;
const LS_KEY = ADMIN_MODE ? "laxcbt_admin" : "laxcbt_tt";
const PAT_KEY = "laxcbt_gh_pat";
const DOCKS = ["D16", "D17", "D18", "D19", "D20", "D21", "D22"];
const STATES = ["idle", "loading", "unloading"];
const STATE_LABEL = { idle: "空闲", loading: "Loading", unloading: "Unloading" };
// 常见 carrier 名字 / 简写
const CARRIER_ALIAS = {
  ONTRAC: "ONTRAC", OTC: "ONTRAC",
  USPS: "USPS", USM: "USPS",
  FEDEX: "FEDEX", FDX: "FEDEX",
  GOFO: "GOFO", GOF: "GOFO",
  UNIUNI: "UNIUNI", UNI: "UNIUNI",
  UPS: "UPS",
  VEHO: "VEHO",
  SWIFTX: "SWIFTX", SWX: "SWIFTX",
};

let state = {
  date: new Date().toISOString().slice(0, 10),
  snapTime: new Date().toTimeString().slice(0, 5),
  K: 264,
  qtyText: "",
  docks: DOCKS.map(() => ({ status: "idle", carrier: "", boards: null })),
  updatedAt: null,                    // Ray 后台发布的时间戳
};

function el(id) { return document.getElementById(id); }

// --- 持久化 ---
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  if (!Array.isArray(state.docks) || state.docks.length !== DOCKS.length) {
    state.docks = DOCKS.map(() => ({ status: "idle", carrier: "", boards: null }));
  }
}

// --- 远端数据 ---
async function fetchRemote(verbose) {
  const url = DATA_URL + "?t=" + Date.now();      // 防缓存
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    // 关包/K/日期/时刻 从远端覆盖，Dock 保留本地
    if (d.date) state.date = d.date;
    if (d.snapTime) state.snapTime = d.snapTime;
    if (d.K != null) state.K = d.K;
    if (d.qtyText != null) state.qtyText = d.qtyText;
    if (d.updatedAt) state.updatedAt = d.updatedAt;
    // 同步输入控件
    el("shiftDate").value = state.date;
    el("snapTime").value = state.snapTime;
    el("K").value = state.K;
    el("qtyText").value = state.qtyText;
    save(); refreshHeader(); recompute();
    if (verbose) toast(`已拉取 (${state.updatedAt || "无时间戳"})`);
    return true;
  } catch (e) {
    if (verbose) toast("拉取失败：" + e.message, "err");
    return false;
  }
}

// --- Ray 发布：PUT data.json 到 GitHub repo ---
async function publish() {
  if (REPO_OWNER === "__OWNER__" || REPO_NAME === "__REPO__") {
    alert("配置未填：请先在 dock_board.html 顶部填 REPO_OWNER / REPO_NAME");
    return;
  }
  const token = localStorage.getItem(PAT_KEY);
  if (!token) {
    alert("先点「🔑 Token」配置 GitHub PAT（Contents: write 权限）");
    return;
  }
  const data = {
    updatedAt: new Date().toISOString(),
    date: state.date,
    snapTime: state.snapTime,
    K: state.K,
    qtyText: state.qtyText || "",
  };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + "\n")));
  const api = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;
  try {
    // 1) 读 sha（如果 data.json 已存在）
    let sha = undefined;
    const getRes = await fetch(api, {
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
    });
    if (getRes.ok) {
      const info = await getRes.json();
      sha = info.sha;
    } else if (getRes.status !== 404) {
      throw new Error("GET sha 失败 HTTP " + getRes.status);
    }
    // 2) PUT 新内容
    const putRes = await fetch(api, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `update data ${data.date} ${data.snapTime}`,
        content, sha,
      })
    });
    if (!putRes.ok) {
      const errText = await putRes.text();
      throw new Error("PUT 失败 HTTP " + putRes.status + "\n" + errText.slice(0, 200));
    }
    state.updatedAt = data.updatedAt;
    save(); refreshHeader();
    toast("✓ 已发布，TT 侧刷新可见");
  } catch (e) {
    toast("发布失败：" + e.message, "err");
    console.error(e);
  }
}

// --- 配置 PAT ---
function configPAT() {
  const cur = localStorage.getItem(PAT_KEY) || "";
  const masked = cur ? cur.slice(0, 7) + "…" + cur.slice(-4) : "（未设置）";
  const v = prompt(
    `GitHub Personal Access Token (Fine-grained, Contents: Read & Write on ${REPO_OWNER}/${REPO_NAME})\n当前：${masked}\n\n粘贴新 token，留空取消：`
  );
  if (v == null) return;
  if (v.trim() === "") return;
  localStorage.setItem(PAT_KEY, v.trim());
  toast("Token 已保存到本机 localStorage（不会上传）");
}

// --- Toast 轻提示 ---
let _toastTimer = null;
function toast(msg, kind) {
  let t = el("_toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "_toast";
    t.style.cssText = "position:fixed;top:16px;right:16px;z-index:1000;padding:10px 14px;border-radius:4px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);background:#263238;color:white;max-width:400px;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = kind === "err" ? "#c62828" : "#263238";
  t.style.display = "block";
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.style.display = "none"; }, 3500);
}

// --- 解析场上关包 ---
// 每行要么是「目的地」小标题（可带尾巴，如 "ATL 28+8滞留"），要么是「承运商: 数量」
function parseQty(text) {
  const result = { total: 0, byDest: {} };
  let curDest = null;
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (!t) continue;
    // 先尝试 "承运商: 数量"
    const kv = t.match(/^([A-Za-z][A-Za-z0-9_\-]+)\s*[:：]\s*(\d+(?:\.\d+)?)/);
    if (kv) {
      const car = kv[1].toUpperCase();
      const name = CARRIER_ALIAS[car] || car;
      const qty = Number(kv[2]);
      if (!curDest) curDest = "未分类";
      if (!result.byDest[curDest]) result.byDest[curDest] = { total: 0, items: {} };
      result.byDest[curDest].items[name] = (result.byDest[curDest].items[name] || 0) + qty;
      result.byDest[curDest].total += qty;
      result.total += qty;
      continue;
    }
    // 再尝试「目的地」小标题：行首 2–4 个大写字母（LAX / EWR / ATL / DFW / ORD / SEA ...）
    const dm = t.match(/^([A-Z]{2,4})\b/);
    if (dm) curDest = dm[1];
  }
  return result;
}

// --- 渲染场上关包解析结果 ---
function renderQtyResult(parsed) {
  const n = el("qtyResult");
  if (!parsed.total) { n.innerHTML = ""; return; }
  const dests = Object.keys(parsed.byDest);
  // 按目的地的 total 降序
  dests.sort((a, b) => parsed.byDest[b].total - parsed.byDest[a].total);
  let html = "<table><thead><tr><th>目的地 / 承运商</th><th style='text-align:right'>gaylord</th></tr></thead><tbody>";
  for (const d of dests) {
    const g = parsed.byDest[d];
    html += `<tr class="dest"><td>${d}</td><td class="num">${g.total}</td></tr>`;
    const carriers = Object.keys(g.items).sort((a, b) => g.items[b] - g.items[a]);
    for (const c of carriers) {
      html += `<tr><td style="padding-left:24px;color:#607d8b">${c}</td><td class="num" style="color:#607d8b">${g.items[c]}</td></tr>`;
    }
  }
  html += `<tr class="total"><td>合计</td><td class="num">${parsed.total}</td></tr>`;
  html += "</tbody></table>";
  n.innerHTML = html;
}

// --- 渲染 Dock 列表 ---
function renderDocks() {
  const n = el("dockList");
  let html = "";
  state.docks.forEach((d, i) => {
    const cls = d.status;
    html += `<div class="drow ${cls}">`;
    html += `<div class="dlab">${DOCKS[i]}</div>`;
    html += `<select data-i="${i}" data-k="status">`;
    for (const s of STATES) {
      html += `<option value="${s}"${d.status === s ? " selected" : ""}>${STATE_LABEL[s]}</option>`;
    }
    html += "</select>";
    const hid = d.status === "loading" ? "" : " hidden";
    html += `<div class="meta-inputs${hid}">
      <input type="text" placeholder="carrier (USM / FDX ...)" data-i="${i}" data-k="carrier" value="${d.carrier || ""}">
      <input type="number" min="0" step="1" placeholder="板" data-i="${i}" data-k="boards" value="${d.boards == null ? "" : d.boards}">
      <span style="font-size:11px;color:#78909c">板</span>
    </div>`;
    html += `<div class="timecol">${d.status === "loading" && d.boards ? d.boards + " 板" : (d.status === "unloading" ? "卸货中" : "")}</div>`;
    html += "</div>";
  });
  n.innerHTML = html;
  // 绑定 change
  n.querySelectorAll("select, input").forEach(x => {
    x.addEventListener("input", (e) => {
      const i = +x.dataset.i, k = x.dataset.k;
      let v = x.value;
      if (k === "boards") v = v === "" ? null : Number(v);
      state.docks[i][k] = v;
      if (k === "status") {
        // 切回非 loading 时清掉 carrier/板，避免显示错乱
        if (v !== "loading") { state.docks[i].carrier = ""; state.docks[i].boards = null; }
        save(); renderDocks(); recompute();
      } else {
        save(); recompute();
      }
    });
  });
}

// --- 汇总 ---
function recompute() {
  const parsed = parseQty(state.qtyText || "");
  renderQtyResult(parsed);

  const total = parsed.total;
  const util = (state.K > 0 && total > 0) ? total / state.K : null;

  // Dock 状态统计
  let idle = 0, loading = 0, unloading = 0, loadBoards = 0;
  for (const d of state.docks) {
    if (d.status === "idle") idle++;
    else if (d.status === "loading") { loading++; loadBoards += (Number(d.boards) || 0); }
    else if (d.status === "unloading") unloading++;
  }
  const used = loading + unloading;

  // 卡片
  const cP = el("cPeak"), cU = el("cUtil"), cD = el("cDock"), cS = el("cStatus");
  [cP, cU, cD, cS].forEach(c => c.classList.remove("warn", "ok"));

  cP.querySelector(".val").textContent = total ? total + " gaylord" : "—";
  if (total && state.K > 0) {
    cP.querySelector(".sub").textContent = Object.keys(parsed.byDest).map(d => `${d} ${parsed.byDest[d].total}`).join(" · ");
  } else {
    cP.querySelector(".sub").textContent = "";
  }
  if (total > state.K) cP.classList.add("warn");

  if (util == null) {
    cU.querySelector(".val").textContent = "—";
    cU.querySelector(".sub").textContent = total ? "需填 K" : "需贴清单";
  } else {
    cU.querySelector(".val").textContent = (util * 100).toFixed(0) + "%";
    cU.querySelector(".sub").textContent = `${total} / ${state.K}`;
    if (util >= 1) cU.classList.add("warn");
    else if (util >= 0.85) cU.classList.add("warn");
    else cU.classList.add("ok");
  }

  cD.querySelector(".val").textContent = `${used} / ${DOCKS.length}`;
  cD.querySelector(".sub").textContent = `Loading ${loading}（${loadBoards} 板） · Unloading ${unloading}`;
  if (used >= DOCKS.length) cD.classList.add("warn");
  else if (used <= 2) cD.classList.add("ok");

  const dockTight = used >= DOCKS.length - 1;
  const yardTight = util != null && util >= 0.85;
  let flag = "宽松", cls = "ok";
  if (dockTight && yardTight) { flag = "双瓶颈"; cls = "warn"; }
  else if (yardTight) { flag = "场地瓶颈"; cls = "warn"; }
  else if (dockTight) { flag = "Dock 瓶颈"; cls = "warn"; }
  cS.querySelector(".val").textContent = flag;
  cS.querySelector(".sub").textContent = `${state.snapTime} 快照`;
  cS.classList.add(cls);
}

// --- 事件绑定 ---
function bind() {
  el("shiftDate").value = state.date;
  el("snapTime").value = state.snapTime;
  el("K").value = state.K;
  el("qtyText").value = state.qtyText || "";

  el("shiftDate").addEventListener("change", e => { state.date = e.target.value; save(); refreshHeader(); });
  el("snapTime").addEventListener("change", e => { state.snapTime = e.target.value; save(); recompute(); refreshHeader(); });
  el("K").addEventListener("input", e => { state.K = Number(e.target.value) || 0; save(); recompute(); refreshHeader(); });
  el("qtyText").addEventListener("input", e => { state.qtyText = e.target.value; save(); recompute(); });

  el("btnNow").addEventListener("click", () => {
    const now = new Date();
    state.date = now.toISOString().slice(0, 10);
    state.snapTime = now.toTimeString().slice(0, 5);
    el("shiftDate").value = state.date;
    el("snapTime").value = state.snapTime;
    save(); recompute(); refreshHeader();
  });
  el("btnClear").addEventListener("click", () => {
    if (!confirm("清空所有录入？")) return;
    state.qtyText = "";
    state.docks = DOCKS.map(() => ({ status: "idle", carrier: "", boards: null }));
    el("qtyText").value = "";
    save(); renderDocks(); recompute();
  });

  if (el("btnPublish")) el("btnPublish").addEventListener("click", publish);
  if (el("btnRefresh")) el("btnRefresh").addEventListener("click", () => fetchRemote(true));
  if (el("btnConfigPAT")) el("btnConfigPAT").addEventListener("click", configPAT);

  el("loadDemo").addEventListener("click", (e) => {
    e.preventDefault();
    state.docks = [
      { status: "loading", carrier: "USM", boards: 15 },
      { status: "unloading", carrier: "", boards: null },
      { status: "idle", carrier: "", boards: null },
      { status: "loading", carrier: "FDX", boards: 20 },
      { status: "unloading", carrier: "", boards: null },
      { status: "idle", carrier: "", boards: null },
      { status: "loading", carrier: "VEHO", boards: 12 },
    ];
    save(); renderDocks(); recompute();
  });
}

function refreshHeader() {
  el("shiftLabel").textContent = `快照时间：${state.date} ${state.snapTime}  ·  K = ${state.K}  ·  7 道 dock（D16–D22）`;
  el("bannerText").textContent = ADMIN_MODE
    ? "🛠 Ray 后台 · 填关包/K → 点「🚀 发布」推送到 GitHub，TT 侧刷新即可见"
    : "👀 TT 视图 · Dock 可编辑，关包由 Ray 发布。点「🔄 刷新」拉最新";
  const uAt = state.updatedAt;
  el("updatedAt").textContent = uAt
    ? "最后发布：" + new Date(uAt).toLocaleString("zh-CN", { hour12: false })
    : "";
}

// --- 启动 ---
load();
document.body.classList.add(ADMIN_MODE ? "admin-mode" : "tt-mode");
if (TT_MODE) {
  const q = el("qtyText");
  if (q) q.readOnly = true;
  const t = document.querySelector("title");
  if (t) t.textContent = "LAX CBT 库容潮汐板 · TT 视图";
}
bind();
refreshHeader();
renderDocks();
recompute();
// TT 启动时拉最新数据；admin 不自动拉，避免覆盖未发布的草稿（想拉手动点）
if (TT_MODE) fetchRemote(false);
</script>
</body>
</html>
